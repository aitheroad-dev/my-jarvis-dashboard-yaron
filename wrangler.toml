name = "my-jarvis-dashboard-yaron"
compatibility_date = "2024-11-06"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[vars]
# Dashboard auth runs through Cloudflare Access. Functions VERIFY the signed
# Cf-Access-Jwt-Assertion (RS256) against the team JWKS — issuer + audience +
# signature — and derive the email from the verified claims (not the spoofable
# Cf-Access-Authenticated-User-Email header). The email must be on the allow-list.
TENANT_OWNER_EMAIL = "aitheroad@gmail.com"
# CF Access team auth domain + this app's Application Audience (AUD) tag.
ACCESS_TEAM_DOMAIN = "small-fire-f8d3.cloudflareaccess.com"
ACCESS_AUD = "da27b6b7d6ed7f4d92516c708135a929b85e55f8dd75ad5504b799d6e3930946"
# Who may use the dashboard (comma-separated). Yaron + Noa.
ACCESS_ALLOWED_EMAILS = "aitheroad@gmail.com,noabarkai@gmail.com"
# Of the above, who is restricted to ONLY the move tracker (role "move"). The
# owner is force-excluded in code, so listing him here is a no-op (lockout-safe).
ACCESS_MOVE_ONLY_EMAILS = "noabarkai@gmail.com"
# Public base URL of the R2 voice bucket; audio_url = ${VOICE_PUBLIC_URL}/<id>.mp3
VOICE_PUBLIC_URL = "https://pub-6fcd8a707615437da46fb97b8be570ba.r2.dev"
# Multi-tenant recorder (P0): this fork's identity + the callback URL the box uses
# to hand results back. INGEST_SECRET is a Pages SECRET (not here). See ISA_MULTITENANT.md.
RECORDER_TENANT_ID = "yaron"
RECORDER_INGEST_URL = "https://my-jarvis-dashboard-yaron.pages.dev/api/recordings/ingest"

# Data store: Cloudflare D1 (SQLite). Replaces Neon Postgres — no DATABASE_URL secret.
[[d1_databases]]
binding = "DB"
database_name = "mjd-yaron-db"
database_id = "bede39da-5d58-4a2d-9198-89f9f6e2804c"

# Voice-clip audio store: Cloudflare R2 (replaces Postgres bytea).
[[r2_buckets]]
binding = "VOICE_BUCKET"
bucket_name = "mjd-yaron-voice"

# Workers AI — powers the /move natural-language agent (functions/api/move/agent.ts).
# In-platform, no API key, EU edge. Bound as env.AI.
[ai]
binding = "AI"

# Multi-tenant meeting recorder (P0) — shared control plane. POST /api/meetings
# enqueues a job here; the box PULLS it (HTTP pull consumer) and hands results back
# via POST /api/recordings/ingest (HMAC INGEST_SECRET). The box never holds this
# fork's D1 token. See pai-meeting-recorder/ISA_MULTITENANT.md.
[[queues.producers]]
queue = "recorder-jobs"
binding = "RECORDER_QUEUE"
