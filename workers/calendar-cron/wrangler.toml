name = "my-jarvis-calendar-cron"
main = "src/index.ts"
compatibility_date = "2024-11-06"
compatibility_flags = ["nodejs_compat"]

# RETIRED 2026-06-29 — Vexa auto-dispatch archived (Path 6 owned recorder replaces it).
# Empty schedule = worker stays deployable but NEVER fires (an omitted [triggers]
# section does NOT prune an existing cron — you must pass crons = []). To restore
# Vexa auto-join, set the cron back to ["* * * * *"] and redeploy. The new recorder's
# auto-trigger is built separately (box-local).
[triggers]
crons = []

[[d1_databases]]
binding = "DB"
database_name = "mjd-yaron-db"
database_id = "bede39da-5d58-4a2d-9198-89f9f6e2804c"

[vars]
VEXA_API_BASE = "https://api.cloud.vexa.ai"

# Secrets set out-of-band (wrangler secret / API), never committed:
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, CAL_TOKEN_KEY, VEXA_API_KEY, TRIGGER_SECRET
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID  (owner alerts on silent Vexa failures;
#   notify no-ops if either is unset — the feature depends on both being present here)
