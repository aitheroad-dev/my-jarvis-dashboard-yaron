name = "my-jarvis-calendar-cron"
main = "src/index.ts"
compatibility_date = "2024-11-06"
compatibility_flags = ["nodejs_compat"]

# Calendar auto-join for the OWNED recorder (Path 6, multi-tenant P2 — 2026-07-01).
# Every minute this syncs Google Calendar into D1 and ENQUEUES a recorder job for
# each opt-in meeting whose start has arrived. The box is the queue's HTTP pull
# consumer: it records → transcribes → HMAC-POSTs the result to this fork's
# /api/recordings/ingest. The cron never touches the box; it only reads this fork's
# calendar_events and writes this fork's meetings (fork-local — replicates per fork).
# Vexa retired 2026-06-29; the Vexa-era auto-dispatch is now an enqueue.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "mjd-yaron-db"
database_id = "bede39da-5d58-4a2d-9198-89f9f6e2804c"

# Producer binding onto the shared recorder control plane. Same queue the manual
# button (POST /api/meetings) produces to; the box is the sole HTTP pull consumer.
[[queues.producers]]
queue = "recorder-jobs"
binding = "RECORDER_QUEUE"

[vars]
RECORDER_TENANT_ID = "yaron"
RECORDER_INGEST_URL = "https://my-jarvis-dashboard-yaron.pages.dev/api/recordings/ingest"
# RECORDER_R2_BUCKET intentionally unset in P0/P2 (box uses its single bucket);
# forward-compat per-fork audio routing is P1 — matches the Pages project.

# Secrets set out-of-band (wrangler secret / API), never committed:
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, CAL_TOKEN_KEY, TRIGGER_SECRET,
#   INGEST_SECRET  (per-fork HMAC callback key — MUST byte-equal the Pages project's
#                   INGEST_SECRET, else the box's signed result callback 401s),
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID  (owner alerts; notify no-ops if unset).
# VEXA_API_KEY is retired — the leftover secret is harmless and can be deleted.
#
# ROTATING INGEST_SECRET (Forge W2 — "drain the queue" is NOT enough): the box
# verifies each result callback with the PER-JOB ingest_secret carried in the
# JobContract, and those callbacks arrive 30-60 min AFTER the job is pulled (once the
# recording finishes). A job already pulled + recording carries the OLD secret and
# will 401 on callback if Pages rotates underneath it. Correct procedure:
#   1. PAUSE both producers — set this cron `crons = []` + redeploy, and stop manual
#      creates (or accept the brief window).
#   2. WAIT for the queue to drain AND every in-flight meetings row
#      (status IN requested/starting/transcribing) to reach a terminal state.
#   3. Rotate INGEST_SECRET on the Pages project AND this worker TOGETHER.
#   4. Resume producers (restore this cron).
# The initial provisioning (2026-07-01) was done while fully idle (queue empty, no
# in-flight rows), so no callback carried a stale secret. A future robustness lever
# is a previous-secret grace verifier on /api/recordings/ingest (accept current OR
# previous during a window) — deferred, no JobContract change needed.
